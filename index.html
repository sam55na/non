<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>عجلة الحظ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* نفس التنسيقات السابقة */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
        }
        .container {
            text-align: center;
            background: rgba(255,255,255,0.95);
            border-radius: 30px;
            padding: 20px;
            max-width: 500px;
        }
        canvas {
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin: 20px 0;
            cursor: pointer;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }
        .result {
            font-size: 1.5em;
            margin-top: 20px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎡 عجلة الحظ</h1>
        <canvas id="wheelCanvas" width="400" height="400"></canvas>
        <button onclick="spinWheel()">🔄 دور العجلة</button>
        <div class="result" id="result">اضغط على الزر لتبدأ</div>
    </div>

    <script>
        const segments = [
            { value: 1, label: "1 🎁", color: "#FF6B6B" },
            { value: 2, label: "2 🎈", color: "#4ECDC4" },
            { value: 3, label: "3 🎉", color: "#45B7D1" },
            { value: 4, label: "4 🎊", color: "#96CEB4" },
            { value: 5, label: "5 ⭐", color: "#FFEAA7" },
            { value: 6, label: "6 🎀", color: "#DDA0DD" },
            { value: 7, label: "7 🏆", color: "#98D8C8" },
            { value: 8, label: "8 🎵", color: "#F7D794" },
            { value: 9, label: "9 🌟", color: "#786FA6" },
            { value: 10, label: "10 💎", color: "#F19066" }
        ];
        
        const segmentCount = segments.length;
        const segmentAngle = (Math.PI * 2) / segmentCount;
        
        let canvas = document.getElementById('wheelCanvas');
        let ctx = canvas.getContext('2d');
        let currentAngle = 0;
        let spinning = false;
        
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;
            
            for (let i = 0; i < segmentCount; i++) {
                const startAngle = currentAngle + i * segmentAngle;
                const endAngle = startAngle + segmentAngle;
                
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.fillStyle = segments[i].color;
                ctx.fill();
                
                ctx.strokeStyle = "white";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.lineTo(centerX, centerY);
                ctx.stroke();
                
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + segmentAngle / 2);
                ctx.textAlign = "center";
                ctx.fillStyle = "#333";
                ctx.font = "bold 20px 'Segoe UI'";
                ctx.fillText(segments[i].label, radius * 0.65, 10);
                ctx.restore();
            }
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, 40, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.fill();
            
            ctx.fillStyle = "#333";
            ctx.beginPath();
            ctx.moveTo(centerX - 10, 5);
            ctx.lineTo(centerX, -15);
            ctx.lineTo(centerX + 10, 5);
            ctx.fill();
        }
        
        function getResult() {
            const angle = (Math.PI * 2 - currentAngle) % (Math.PI * 2);
            const index = Math.floor(angle / segmentAngle) % segmentCount;
            return segments[index].value;
        }
        
        function sendResultToBot(result) {
            const data = JSON.stringify({ value: result, timestamp: Date.now() });
            tg.sendData(data);
            document.getElementById('result').innerHTML = `🎯 النتيجة: ${result} نقطة!`;
            setTimeout(() => tg.close(), 1500);
        }
        
        function spinWheel() {
            if (spinning) return;
            spinning = true;
            
            const spins = 8 + Math.random() * 8;
            const finalAngle = currentAngle + (Math.PI * 2 * spins);
            const startTime = performance.now();
            const duration = 3000;
            
            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(1, elapsed / duration);
                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentAngle = currentAngle + (finalAngle - currentAngle) * easeOut;
                drawWheel();
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    spinning = false;
                    sendResultToBot(getResult());
                }
            }
            
            requestAnimationFrame(animate);
        }
        
        drawWheel();
    </script>
</body>
</html>
