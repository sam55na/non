<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football BOT | Sportmonks API</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; direction: rtl; }
        .error { color: red; background: #fee; padding: 20px; border-radius: 10px; }
        .success { color: green; }
        pre { background: #f4f4f4; padding: 10px; text-align: left; direction: ltr; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>⚽ Football BOT - اختبار Sportmonks API</h1>
    <div id="result">جاري الاتصال بـ API...</div>

    <script>
        const API_TOKEN = "WLSgDr2Vchnj1fedPhBYLRkwgrS4BtUq90yX3qztTCmzrsC3wwn5VGCZBrcz";
        
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            
            try {
                // اختبار 1: جلب قائمة البطولات
                const leaguesRes = await fetch(`https://api.sportmonks.com/v3/football/leagues?api_token=${API_TOKEN}&per_page=5`);
                const leaguesData = await leaguesRes.json();
                
                if (leaguesRes.ok && leaguesData.data) {
                    resultDiv.innerHTML = `<div class="success">✅ API يعمل! تم جلب ${leaguesData.data.length} بطولة.</div>
                    <pre>${JSON.stringify(leaguesData.data.slice(0, 3), null, 2)}</pre>`;
                    
                    // اختبار 2: البحث عن كأس العالم
                    const worldCup = leaguesData.data.find(l => l.name.toLowerCase().includes('world cup'));
                    if (worldCup) {
                        resultDiv.innerHTML += `<div class="success">✅ ✅ تم العثور على كأس العالم! (ID: ${worldCup.id})</div>`;
                    } else {
                        resultDiv.innerHTML += `<div class="error">⚠️ لم يتم العثور على كأس العالم في أول 5 بطولات</div>`;
                    }
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ فشل الاتصال بـ API. الرسالة: ${leaguesData.message || 'خطأ غير معروف'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ خطأ في الاتصال: ${error.message}</div>`;
            }
        }
        
        testAPI();
    </script>
</body>
</html>
