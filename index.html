<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ منصة كرة القدم - SportScore API</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%);
            color: #f0f3fa;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1300px; margin: 0 auto; }
        
        .header {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 30px;
            border-bottom: 3px solid #ffd700;
        }
        .header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #ffd89b, #ffd700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .source-panel {
            background: #1f8a4c;
            border-radius: 15px;
            padding: 10px 20px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }
        
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            background: rgba(20, 28, 44, 0.7);
            padding: 15px 20px;
            border-radius: 50px;
        }
        select {
            background: #1e2a3a;
            border: 1px solid #2d3e5a;
            padding: 10px 20px;
            border-radius: 40px;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
        }
        
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid #2a3448;
            padding-bottom: 10px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 10px 25px;
            color: #a4b0cd;
            cursor: pointer;
            border-radius: 30px;
            font-size: 0.95rem;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #2a3a60;
            color: white;
        }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }
        
        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }
        .match-card {
            background: #111827d9;
            backdrop-filter: blur(4px);
            border-radius: 24px;
            padding: 18px;
            border: 1px solid #2d374b;
            transition: 0.2s;
        }
        .match-card:hover { border-color: #ffd700; transform: translateY(-3px); }
        .teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            font-weight: bold;
            font-size: 1.05rem;
        }
        .score {
            font-size: 1.5rem;
            font-weight: 800;
            background: #00000055;
            padding: 4px 12px;
            border-radius: 40px;
            font-family: monospace;
        }
        .match-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px dashed #2c3a55;
            color: #9aa9c7;
            font-size: 0.75rem;
        }
        .standing-table {
            width: 100%;
            border-collapse: collapse;
            background: #111827;
            border-radius: 20px;
            overflow: hidden;
        }
        .standing-table th, .standing-table td {
            padding: 12px 8px;
            text-align: center;
            border-bottom: 1px solid #2c3a55;
        }
        .standing-table th { background: #1e2a3a; color: #ffd966; }
        
        .loader { text-align: center; padding: 50px; color: #aaa; }
        .error { background: #a1222e80; padding: 20px; border-radius: 18px; text-align: center; }
        
        footer {
            margin-top: 40px;
            text-align: center;
            padding: 20px;
            border-top: 1px solid #2a3448;
            font-size: 0.7rem;
            color: #6c7a9e;
        }
        a { color: #ffd700; text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>⚽ منصة كرة القدم الشاملة</h1>
        <p>نتائج حية • جداول ترتيب • هدافون • إحصائيات</p>
    </div>

    <div class="source-panel">
        🟢 المصدر: SportScore API | يعمل بكفاءة | 10,000 طلب/يوم لكل IP
    </div>

    <div class="filters">
        <select id="leagueSelect">
            <option value="premier-league">🏴󠁧󠁢󠁥󠁮󠁧󠁿 الدوري الإنجليزي</option>
            <option value="laliga">🇪🇸 الدوري الإسباني</option>
            <option value="serie-a">🇮🇹 الدوري الإيطالي</option>
            <option value="bundesliga">🇩🇪 الدوري الألماني</option>
            <option value="ligue-1">🇫🇷 الدوري الفرنسي</option>
            <option value="uefa-champions-league">🌟 دوري أبطال أوروبا</option>
        </select>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="matches">📅 المباريات</button>
        <button class="tab-btn" data-tab="standings">🏆 جدول الترتيب</button>
        <button class="tab-btn" data-tab="scorers">🎯 الهدافون</button>
    </div>

    <div id="matches" class="tab-content active"><div id="matchesContainer" class="matches-grid"><div class="loader">⏳ جاري تحميل المباريات...</div></div></div>
    <div id="standings" class="tab-content"><div id="standingsContainer"><div class="loader">⏳ جاري تحميل الترتيب...</div></div></div>
    <div id="scorers" class="tab-content"><div id="scorersContainer"><div class="loader">⏳ جاري تحميل الهدافين...</div></div></div>

    <footer>
        Powered by <a href="https://sportscore.com/" target="_blank">SportScore</a> • بيانات محدّثة • 10,000 طلب/يوم
    </footer>
</div>

<script>
    // ======================== SportScore API - لا يحتاج مفتاح ========================
    // التوثيق الرسمي: https://pypi.org/project/sportscore/
    const SPORTSCORE_API = "https://api.sportscore.com/v1";
    
    let currentLeague = "premier-league";
    
    // أسماء البطولات كما تعرفها SportScore
    const leagueSlugs = {
        "premier-league": { name: "الدوري الإنجليزي", slug: "premier-league" },
        "laliga": { name: "الدوري الإسباني", slug: "laliga" },
        "serie-a": { name: "الدوري الإيطالي", slug: "serie-a" },
        "bundesliga": { name: "الدوري الألماني", slug: "bundesliga" },
        "ligue-1": { name: "الدوري الفرنسي", slug: "ligue-1" },
        "uefa-champions-league": { name: "دوري الأبطال", slug: "uefa-champions-league" }
    };
    
    // ======================== دوال الاتصال المباشرة ========================
    async function fetchAPI(endpoint) {
        try {
            const response = await fetch(`${SPORTSCORE_API}${endpoint}`);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            return await response.json();
        } catch (error) {
            console.error("API Error:", error);
            throw error;
        }
    }
    
    // جلب المباريات (نتائج + قادمة) من SportScore
    async function getMatches(leagueSlug, limit = 40) {
        try {
            // جلب جميع مباريات كرة القدم
            const data = await fetchAPI(`/matches/football?limit=${limit}`);
            let matches = data.data || [];
            
            // فلترة حسب الدوري المختار
            if (leagueSlug !== "all") {
                matches = matches.filter(m => m.league_slug === leagueSlug);
            }
            
            const now = new Date();
            const upcoming = matches.filter(m => new Date(m.start_time) > now);
            const past = matches.filter(m => new Date(m.start_time) <= now && m.status === "finished");
            
            return { upcoming: upcoming.slice(0, 25), past: past.slice(0, 20) };
        } catch (error) {
            console.error("Error fetching matches:", error);
            return { upcoming: [], past: [] };
        }
    }
    
    // جلب جدول الترتيب
    async function getStandings(leagueSlug) {
        try {
            const data = await fetchAPI(`/standings/football/${leagueSlug}`);
            return data.standings || [];
        } catch (error) {
            console.error("Standings error:", error);
            return [];
        }
    }
    
    // جلب الهدافين
    async function getTopScorers(leagueSlug, limit = 20) {
        try {
            const data = await fetchAPI(`/top-scorers/football/${leagueSlug}?limit=${limit}`);
            return data.scorers || [];
        } catch (error) {
            console.error("Scorers error:", error);
            return [];
        }
    }
    
    // ======================== دوال العرض ========================
    function renderMatches(upcoming, past) {
        const container = document.getElementById("matchesContainer");
        
        if ((!upcoming || upcoming.length === 0) && (!past || past.length === 0)) {
            container.innerHTML = '<div class="error">📭 لا توجد مباريات متاحة حالياً. قد يكون الموسم في إجازة.</div>';
            return;
        }
        
        let html = '';
        
        // المباريات القادمة
        if (upcoming && upcoming.length > 0) {
            html += '<div style="margin-bottom: 30px;"><h3 style="color: #ffd700; margin-bottom: 15px;">📅 المباريات القادمة</h3><div class="matches-grid">';
            upcoming.forEach(m => {
                const home = m.home_team || m.home || "?";
                const away = m.away_team || m.away || "?";
                const date = new Date(m.start_time);
                html += `
                    <div class="match-card">
                        <div class="teams"><span>${home}</span><span class="score">🆚</span><span>${away}</span></div>
                        <div class="match-footer">
                            <span>📅 ${date.toLocaleDateString("ar-EG")}</span>
                            <span>⏰ ${date.toLocaleTimeString("ar-EG", { hour: '2-digit', minute:'2-digit' })}</span>
                            <span>🏟️ ${m.venue || "غير محدد"}</span>
                        </div>
                    </div>
                `;
            });
            html += '</div></div>';
        }
        
        // النتائج السابقة
        if (past && past.length > 0) {
            html += '<div><h3 style="color: #ffd700; margin-bottom: 15px;">📋 النتائج السابقة</h3><div class="matches-grid">';
            past.forEach(m => {
                const home = m.home_team || m.home || "?";
                const away = m.away_team || m.away || "?";
                const homeScore = m.home_score ?? m.score?.home ?? "-";
                const awayScore = m.away_score ?? m.score?.away ?? "-";
                const date = new Date(m.start_time);
                html += `
                    <div class="match-card">
                        <div class="teams"><span>${home}</span><span class="score">${homeScore} - ${awayScore}</span><span>${away}</span></div>
                        <div class="match-footer">
                            <span>📅 ${date.toLocaleDateString("ar-EG")}</span>
                            <span>✅ منتهية</span>
                        </div>
                    </div>
                `;
            });
            html += '</div></div>';
        }
        
        container.innerHTML = html;
    }
    
    function renderStandings(standings) {
        const container = document.getElementById("standingsContainer");
        if (!standings || standings.length === 0) {
            container.innerHTML = '<div class="error">🏆 جدول الترتيب غير متوفر حالياً</div>';
            return;
        }
        
        const html = `
            <table class="standing-table">
                <thead>
                    <tr><th>#</th><th>الفريق</th><th>لعب</th><th>فوز</th><th>تعادل</th><th>خسارة</th><th>له</th><th>عليه</th><th>فارق</th><th>نقاط</th></tr>
                </thead>
                <tbody>
                    ${standings.map(t => `
                        <tr>
                            <td>${t.position || t.rank || "-"}</td>
                            <td style="text-align:right;">${t.team_name || t.name || "?"}</td>
                            <td>${t.played || 0}</td>
                            <td>${t.wins || 0}</td>
                            <td>${t.draws || 0}</td>
                            <td>${t.losses || 0}</td>
                            <td>${t.goals_for || t.goals_scored || 0}</td>
                            <td>${t.goals_against || 0}</td>
                            <td>${(t.goals_for || 0) - (t.goals_against || 0)}</td>
                            <td><strong>${t.points || 0}</strong></td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
        container.innerHTML = html;
    }
    
    function renderTopScorers(scorers) {
        const container = document.getElementById("scorersContainer");
        if (!scorers || scorers.length === 0) {
            container.innerHTML = '<div class="error">🎯 قائمة الهدافين غير متوفرة حالياً</div>';
            return;
        }
        
        let html = '<div style="display: flex; flex-direction: column; gap: 12px;">';
        scorers.slice(0, 20).forEach((s, i) => {
            const player = s.player_name || s.name || "?";
            const team = s.team_name || "";
            const goals = s.goals || 0;
            html += `
                <div class="match-card" style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-weight: bold; width: 35px;">${i+1}</span>
                    <span style="flex: 2;">${player}</span>
                    <span style="color: #ffd700;">⚽ ${goals}</span>
                    <span style="flex: 1; color: #9aa9c7;">${team}</span>
                </div>
            `;
        });
        html += '</div>';
        container.innerHTML = html;
    }
    
    // ======================== التحميل الرئيسي ========================
    async function loadAllData() {
        ["matchesContainer", "standingsContainer", "scorersContainer"].forEach(id => {
            document.getElementById(id).innerHTML = '<div class="loader">⏳ جاري التحميل...</div>';
        });
        
        try {
            const leagueSlug = currentLeague;
            const [matches, standings, scorers] = await Promise.all([
                getMatches(leagueSlug, 50),
                getStandings(leagueSlug),
                getTopScorers(leagueSlug, 20)
            ]);
            
            renderMatches(matches.upcoming || [], matches.past || []);
            renderStandings(standings);
            renderTopScorers(scorers);
            
        } catch (err) {
            console.error(err);
            document.getElementById("matchesContainer").innerHTML = `<div class="error">⚠️ خطأ في التحميل: ${err.message}<br>يرجى تحديث الصفحة أو المحاولة لاحقاً.</div>`;
        }
    }
    
    // ======================== الإعدادات ========================
    function setupTabsAndEvents() {
        const tabs = document.querySelectorAll(".tab-btn");
        tabs.forEach(btn => {
            btn.addEventListener("click", () => {
                const tabId = btn.getAttribute("data-tab");
                document.querySelectorAll(".tab-content").forEach(tc => tc.classList.remove("active"));
                document.getElementById(tabId).classList.add("active");
                tabs.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
            });
        });
        
        const leagueSelect = document.getElementById("leagueSelect");
        leagueSelect.addEventListener("change", async (e) => {
            currentLeague = e.target.value;
            await loadAllData();
        });
    }
    
    async function init() {
        setupTabsAndEvents();
        await loadAllData();
    }
    
    init();
</script>
</body>
</html>
