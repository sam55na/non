<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>عجلة الحظ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            margin-bottom: 10px;
            color: #333;
        }
        
        canvas {
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin: 20px 0;
            cursor: pointer;
            transition: transform 0.3s ease;
            max-width: 100%;
            height: auto;
        }
        
        canvas:active {
            transform: scale(0.98);
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result {
            font-size: 1.5em;
            margin-top: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #667eea20 0%, #764ba220 100%);
            border-radius: 15px;
            font-weight: bold;
            color: #333;
        }
        
        .status {
            font-size: 0.9em;
            margin-top: 10px;
            padding: 8px;
            background: #f0f0f0;
            border-radius: 10px;
            color: #666;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎡 عجلة الحظ</h1>
        <canvas id="wheelCanvas" width="400" height="400"></canvas>
        <button onclick="spinWheel()">🔄 دور العجلة</button>
        <div class="result" id="result">اضغط على الزر لتبدأ</div>
        <div class="status" id="status">✅ جاهز</div>
    </div>

    <script>
        // ====================================
        // إعدادات العجلة
        // ====================================
        const segments = [
            { value: 1, label: "1 🎁", color: "#FF6B6B" },
            { value: 2, label: "2 🎈", color: "#4ECDC4" },
            { value: 3, label: "3 🎉", color: "#45B7D1" },
            { value: 4, label: "4 🎊", color: "#96CEB4" },
            { value: 5, label: "5 ⭐", color: "#FFEAA7" },
            { value: 6, label: "6 🎀", color: "#DDA0DD" },
            { value: 7, label: "7 🏆", color: "#98D8C8" },
            { value: 8, label: "8 🎵", color: "#F7D794" },
            { value: 9, label: "9 🌟", color: "#786FA6" },
            { value: 10, label: "10 💎", color: "#F19066" }
        ];
        
        const segmentCount = segments.length;
        const segmentAngle = (Math.PI * 2) / segmentCount;
        
        let canvas = document.getElementById('wheelCanvas');
        let ctx = canvas.getContext('2d');
        let currentAngle = 0;
        let spinning = false;
        
        // ====================================
        // تهيئة Telegram WebApp
        // ====================================
        const tg = window.Telegram.WebApp;
        
        // تغيير لون الخلفية ليتناسب مع التطبيق
        tg.setBackgroundColor("#ffffff");
        tg.setHeaderColor("bg_color");
        
        // إعلام تلغرام أن التطبيق جاهز
        tg.ready();
        
        // توسيع التطبيق لملء الشاشة
        tg.expand();
        
        // عرض معلومات المستخدم في وحدة التحكم (للتجربة)
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            console.log("👤 مستخدم:", tg.initDataUnsafe.user.first_name);
            console.log("🆔 ID:", tg.initDataUnsafe.user.id);
            document.getElementById('status').innerHTML = `✅ مرحباً ${tg.initDataUnsafe.user.first_name}`;
        } else {
            document.getElementById('status').innerHTML = `✅ العجلة جاهزة`;
        }
        
        // ====================================
        // دالة إرسال النتيجة إلى البوت
        // ====================================
        function sendResultToBot(result) {
            // إنشاء البيانات
            const data = JSON.stringify({
                value: result,
                timestamp: Date.now(),
                user_id: tg.initDataUnsafe?.user?.id || 0
            });
            
            console.log("📤 إرسال النتيجة:", data);
            
            // عرض حالة الإرسال
            document.getElementById('status').innerHTML = "📤 جاري الإرسال...";
            document.getElementById('status').style.background = "#ffeaa7";
            
            try {
                // إرسال البيانات إلى البوت
                tg.sendData(data);
                console.log("✅ تم الإرسال بنجاح");
                document.getElementById('status').innerHTML = "✅ تم الإرسال! سيتم الإغلاق...";
                document.getElementById('status').style.background = "#d4edda";
            } catch (error) {
                console.error("❌ خطأ في الإرسال:", error);
                document.getElementById('status').innerHTML = "❌ فشل الإرسال! " + error.message;
                document.getElementById('status').style.background = "#f8d7da";
                return;
            }
            
            // عرض النتيجة للمستخدم
            document.getElementById('result').innerHTML = `🎯 النتيجة: ${result} نقطة! 🎉`;
            
            // إغلاق التطبيق بعد 1.5 ثانية
            setTimeout(() => {
                console.log("🔒 إغلاق التطبيق...");
                tg.close();
            }, 1500);
        }
        
        // ====================================
        // رسم العجلة
        // ====================================
        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;
            
            for (let i = 0; i < segmentCount; i++) {
                const startAngle = currentAngle + i * segmentAngle;
                const endAngle = startAngle + segmentAngle;
                
                // رسم القطاع
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.fillStyle = segments[i].color;
                ctx.fill();
                
                // رسم الحدود
                ctx.strokeStyle = "white";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.lineTo(centerX, centerY);
                ctx.stroke();
                
                // رسم النص
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + segmentAngle / 2);
                ctx.textAlign = "center";
                ctx.fillStyle = "#333";
                ctx.font = "bold 18px 'Segoe UI'";
                ctx.fillText(segments[i].label, radius * 0.65, 8);
                ctx.restore();
            }
            
            // رسم الدائرة الداخلية
            ctx.beginPath();
            ctx.arc(centerX, centerY, 35, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.fill();
            ctx.strokeStyle = "#333";
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // رسم النقطة المركزية
            ctx.beginPath();
            ctx.arc(centerX, centerY, 8, 0, Math.PI * 2);
            ctx.fillStyle = "#667eea";
            ctx.fill();
            
            // رسم السهم العلوي
            ctx.fillStyle = "#333";
            ctx.beginPath();
            ctx.moveTo(centerX - 12, 5);
            ctx.lineTo(centerX, -20);
            ctx.lineTo(centerX + 12, 5);
            ctx.fill();
        }
        
        // ====================================
        // الحصول على النتيجة
        // ====================================
        function getResult() {
            // حساب الزاوية الحالية
            const angle = (Math.PI * 2 - currentAngle) % (Math.PI * 2);
            const index = Math.floor(angle / segmentAngle) % segmentCount;
            const result = segments[index].value;
            console.log("🎯 النتيجة المستخرجة:", result);
            return result;
        }
        
        // ====================================
        // دوران العجلة
        // ====================================
        function spinWheel() {
            if (spinning) {
                console.log("⏳ العجلة تدور بالفعل");
                return;
            }
            
            spinning = true;
            console.log("🎡 بدء الدوران...");
            document.getElementById('status').innerHTML = "🎡 جاري الدوران...";
            document.getElementById('status').style.background = "#ffeaa7";
            
            // عدد الدورات العشوائية
            const spins = 8 + Math.random() * 8;
            const finalAngle = currentAngle + (Math.PI * 2 * spins);
            
            const startTime = performance.now();
            const duration = 3000; // 3 ثواني
            
            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(1, elapsed / duration);
                
                // منحنى التباطؤ (ease out)
                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentAngle = currentAngle + (finalAngle - currentAngle) * easeOut;
                
                drawWheel();
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    // انتهى الدوران
                    spinning = false;
                    const result = getResult();
                    console.log("🎉 النتيجة النهائية:", result);
                    document.getElementById('result').innerHTML = `🎯 النتيجة: ${result} نقطة!`;
                    sendResultToBot(result);
                }
            }
            
            requestAnimationFrame(animate);
        }
        
        // ====================================
        // رسم العجلة لأول مرة
        // ====================================
        drawWheel();
        
        // إضافة مستمع لأحداث اللمس لتوسيع التطبيق
        document.body.addEventListener('touchstart', function() {
            tg.expand();
        });
        
        // معالجة زر الرجوع
        tg.onEvent('backButtonClicked', function() {
            tg.close();
        });
        
        console.log("🎡 عجلة الحظ جاهزة!");
    </script>
</body>
</html>
